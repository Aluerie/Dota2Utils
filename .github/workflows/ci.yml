name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Dependencies workflow starts CI on its PR branch this way: GitHub doesn't run workflows
  # for PRs that a workflow opens, but it does allow a workflow to start another one explicitly;
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The tools are Windows-only (Steam paths, registry, pyautogui), so check them where they run.
    runs-on: windows-latest
    steps:
      # Windows runners check files out with CRLF by default; keep LF like in the repo (ruff formats with LF).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check --output-format github

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest
