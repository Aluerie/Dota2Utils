name: Dependencies

# Upgrades every locked Python dependency (including the steam.py fork) and opens a PR when anything changed,
# with the results of the checks (run here on the new versions) in its description.
#
# With the DEPENDENCIES_TOKEN secret (a fine-grained personal access token for this repo with "Contents" and
# "Pull requests" read/write), the PR is opened with that token, so CI runs on it like on any PR, and it merges
# by itself once CI passes - if the checks here passed too. Without the secret, the PR waits for you:
# GitHub holds CI for PRs opened with the workflow's own token until someone approves it.

on:
  schedule:
    - cron: "37 6 2 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: dependencies

jobs:
  upgrade:
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN != '' }}
    steps:
      # Windows runners check files out with CRLF by default; keep LF like in the repo.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - name: Upgrade the lock file
        shell: bash
        run: |
          uv lock --upgrade 2>&1 | tee "$RUNNER_TEMP/upgrade.txt"
          # Only the "Updated x v1 -> v2" lines, for the PR description;
          { grep -E "^(Updated|Added|Removed) " "$RUNNER_TEMP/upgrade.txt" | sed 's/^/- /' || true; } > "$RUNNER_TEMP/changes.md"

      - name: Install
        run: uv sync --all-packages --locked

      - name: Checks
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          uv run ruff check --output-format github
          uv run ruff format --check
          uv run ty check
          uv run pytest

      - name: Describe the update
        shell: bash
        run: |
          {
            if [ "${{ steps.checks.outcome }}" = "success" ]; then
              echo "✅ Ruff, ty and pytest pass with the new versions."
            else
              echo "❌ Checks fail with the new versions - see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
            echo
            echo "### Updated"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "Made by the [Dependencies workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/dependencies.yml)."
          } > "$RUNNER_TEMP/body.md"

      # Does nothing when uv.lock didn't change;
      - name: Open a pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPENDENCIES_TOKEN || github.token }}
          branch: dependencies/update
          delete-branch: true
          add-paths: uv.lock
          commit-message: "⬆️ Upgrade dependencies"
          title: "⬆️ Upgrade dependencies"
          body-path: ${{ runner.temp }}/body.md

      # GitHub merges it as soon as CI passes on the PR (CI runs because the token above isn't the workflow's own);
      - name: Merge when CI passes
        if: steps.checks.outcome == 'success' && steps.pr.outputs.pull-request-number && env.HAS_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --auto --squash --delete-branch

      - name: Fail if the checks failed
        if: steps.checks.outcome != 'success'
        run: exit 1
