[project]
name = "ListEmoticons"
version = "0.1.0"
description = "Extract Dota 2 emoticons into gifs and list them on a GitHub Pages page."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dota2utils-common",
    "pillow>=12.1.0",
    "vdf>=3.4",
    "vpk>=1.4.0",
]

[project.scripts]
ListEmoticons = "list_emoticons.main:main"

[tool.uv.build-backend]
# The import name stays snake_case (`import list_emoticons`), only the project/command name matches the folder;
module-name = "list_emoticons"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
