[project]
name = "SocialFeed"
version = "0.1.0"
description = "Post messages into your Dota 2 profile's User Feed widget."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dota2utils-common",
    "steamio>=1.2.0",
]

[project.scripts]
SocialFeed = "social_feed.main:main"

[tool.uv.build-backend]
# The import name stays snake_case (`import social_feed`), only the project/command name matches the folder;
module-name = "social_feed"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
