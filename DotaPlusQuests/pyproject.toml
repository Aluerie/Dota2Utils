[project]
name = "DotaPlusQuests"
version = "0.1.0"
description = "Press \"Refresh challenges\" for every hero's Dota Plus quests."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dota2utils-common",
    "pyautogui>=0.9.54",
]

[project.scripts]
DotaPlusQuests = "dota_plus_quests.main:main"

[tool.uv.build-backend]
# The import name stays snake_case (`import dota_plus_quests`), only the project/command name matches the folder;
module-name = "dota_plus_quests"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
